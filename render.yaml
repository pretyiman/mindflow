services:
  - name: mindflow
    type: web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma migrate deploy --schema=server/prisma/schema.prisma
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
