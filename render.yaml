services:
  - name: mindflow
    type: web
    runtime: node
    plan: free
    # Pre-Deploy Command is a paid-plan-only feature, so migrations run as
    # the last build step instead - works identically on the free plan.
    buildCommand: npm install && npm run build && npx prisma migrate deploy --schema=server/prisma/schema.prisma
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
